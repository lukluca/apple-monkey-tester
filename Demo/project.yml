name: DemoApp
options:
  bundleIdPrefix: com.lukluca.applemonkeytesterdemo
  deploymentTarget:
    iOS: "17.0"
packages:
  AppleMonkeyTester:
    path: ..
targets:
  DemoApp:
    type: application
    platform: iOS
    sources:
      - DemoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukluca.applemonkeytesterdemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Monkey Demo"
  DemoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DemoAppUITests
    dependencies:
      - target: DemoApp
      - package: AppleMonkeyTester
        product: AppleMonkeyTester
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukluca.applemonkeytesterdemo.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DemoApp:
    build:
      targets:
        DemoApp: all
        DemoAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DemoAppUITests
